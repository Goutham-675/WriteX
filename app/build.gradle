plugins {
    id("com.android.application")
}

// Build-time config from gitignored files. Falls back to Google's official
// test IDs so debug builds work out of the box; a real ad.properties is
// required before releasing to production.
def adProps = new Properties()
def adPropsFile = rootProject.file("ad.properties")
if (adPropsFile.exists()) {
    adProps.load(adPropsFile.newInputStream())
}
def admobAppId = adProps.getProperty("ADMOB_APP_ID",
        "ca-app-pub-3940256099942544~3347511713")
def rewardedUnitId = adProps.getProperty("REWARDED_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/5224354917")

// Release signing is enabled only when signing.properties exists (gitignored),
// so plain clones still build an unsigned/automatically-signed debug build.
def signingProps = new Properties()
def signingPropsFile = rootProject.file("signing.properties")
if (signingPropsFile.exists()) {
    signingProps.load(signingPropsFile.newInputStream())
}
def keystorePath = signingProps.getProperty("storeFile")
def hasSigning = keystorePath != null && rootProject.file(keystorePath).isFile()

android {
    namespace = "com.example.handwritingrater"
    // 37 = preinstalled platform (avoids downloading another SDK platform)
    compileSdk = 37
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "com.example.handwritingrater"
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        buildConfigField "String", "ADMOB_APP_ID", "\"$admobAppId\""
        buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"$rewardedUnitId\""
        manifestPlaceholders = [admobAppId: admobAppId]
    }
    if (hasSigning) {
        signingConfigs {
            release {
                storeFile = rootProject.file(signingProps.getProperty("storeFile"))
                storePassword = signingProps.getProperty("storePassword")
                keyAlias = signingProps.getProperty("keyAlias")
                keyPassword = signingProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            if (hasSigning) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = false
        buildConfig = true
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.camera:camera-core:1.4.2")
    implementation("androidx.camera:camera-camera2:1.4.2")
    implementation("androidx.camera:camera-lifecycle:1.4.2")
    implementation("androidx.camera:camera-view:1.4.2")
    implementation("androidx.exifinterface:exifinterface:1.3.7")
    implementation("com.google.android.gms:play-services-ads:23.0.0")
    testImplementation("junit:junit:4.13.2")
}